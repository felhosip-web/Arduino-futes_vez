[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
; Ha újabb bootloader-es klón Nano-d van, használd ezt:
; board = nanoatmega328new
framework = arduino
monitor_speed = 115200

build_flags =
    -DSOFTSPI
    -DSOFT_SPI_MISO_PIN=16
    -DSOFT_SPI_MOSI_PIN=15
    -DSOFT_SPI_SCK_PIN=14

lib_deps =
    nrf24/RF24@^1.4.9
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    greiman/DigitalIO@^1.0.1
